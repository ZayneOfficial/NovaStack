
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Under Review</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #053199, #001f54);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 30px;
            border-radius: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 55px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 50px);
            margin-bottom: 18px;
            line-height: 1.1;
        }

        h1 span {
            color: #ffb000;
        }

        .message {
            font-size: 18px;
            line-height: 1.7;
            color: #f0f4ff;
            margin-bottom: 30px;
        }

        .notice {
            display: inline-block;
            background: #ffb000;
            color: #001f54;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .contact-btn {
            display: inline-block;
            text-decoration: none;
            background: white;
            color: #053199;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .contact-btn:hover {
            background: #ffb000;
            color: #001f54;
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 22px;
            }

            .message {
                font-size: 16px;
            }

            .logo {
                width: 95px;
                height: 95px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Replace with your actual logo -->
        <img src="images/nova.png" alt="Company Logo" class="logo">

        <section class="card">

            <div class="icon">🔧</div>

            <div class="notice">
                WEBSITE UNDER REVIEW
            </div>

            <h1>
                We're Making Things <span>Better.</span>
            </h1>

            <p class="message">
                Our website is currently under review as we work on
                improvements and updates to give you a better experience.
                We appreciate your patience and look forward to welcoming
                you back soon.
            </p>

            <a href="mailto:your@email.com" class="contact-btn">
                Contact Us
            </a>

        </section>

        <p class="footer">
            © 2026 NovaStack. All rights reserved.
        </p>

    </main>

</body>
</html>
