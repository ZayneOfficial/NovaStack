
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Under Review</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.22), transparent 22%),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.18), transparent 25%),
                linear-gradient(135deg, #020817 0%, #0f172a 48%, #111827 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 28px;
            filter: drop-shadow(0 14px 25px rgba(37, 99, 235, 0.4));
        }

        .card {
            background: rgba(15, 23, 42, 0.74);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 28px;
            padding: 52px 32px;
            box-shadow: 0 28px 60px rgba(2, 6, 23, 0.52);
        }

        .icon {
            font-size: 58px;
            margin-bottom: 22px;
            filter: drop-shadow(0 10px 20px rgba(59, 130, 246, 0.2));
        }

        .notice {
            display: inline-block;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #111827;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 26px;
            box-shadow: 0 12px 26px rgba(245, 158, 11, 0.25);
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            margin-bottom: 18px;
            line-height: 1.08;
            letter-spacing: -0.05em;
        }

        h1 span {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .message {
            font-size: 1.08rem;
            line-height: 1.7;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .contact-btn {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #ffffff, #dbeafe);
            color: #0f172a;
            padding: 14px 30px;
            border-radius: 12px;
            font-weight: 800;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 16px 24px rgba(148, 163, 184, 0.2);
        }

        .contact-btn:hover {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            transform: translateY(-3px);
            box-shadow: 0 20px 30px rgba(245, 158, 11, 0.2);
        }

        .footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: rgba(226, 232, 240, 0.8);
        }

        @media (max-width: 600px) {
            .card {
                padding: 38px 22px;
            }

            .message {
                font-size: 1rem;
            }

            .logo {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Replace with your actual logo -->
        <img src="images/nova.png" alt="Company Logo" class="logo">

        <section class="card">

            <div class="icon">🔧</div>

            <div class="notice">
                WEBSITE UNDER REVIEW
            </div>

            <h1>
                We're Making Things <span>Better.</span>
            </h1>

            <p class="message">
                Our website is currently under review as we work on
                improvements and updates to give you a better experience.
                We appreciate your patience and look forward to welcoming
                you back soon.
            </p>

            <a href="mailto:your@email.com" class="contact-btn">
                Contact Us
            </a>

        </section>

        <p class="footer">
            © 2026 NovaStack. All rights reserved.
        </p>

    </main>

</body>
</html>
